<!--
  MECHANICS ONLY. Copy this into every mockup, then never think about it again.

  This file deliberately contains NO layout and NO visual style. Those must be
  invented fresh for each prospect (see BUILT.md). What lives here is the plumbing
  that took real debugging to get right and that has no reason to change:

    - bilingual harvest + swap, with localStorage
    - scroll reveals WITH the fail-safe (this is the one that prevents a blank page)
    - counters that can never render "0"
    - mobile nav toggle
    - demo form handler
    - reduced-motion handling

  Class names used: .rv (reveal), [data-count] (counter), #nav / #burger, #f / #sent,
  .lang button[data-lang]. Rename them if you like, but keep the behaviour.
-->

<!-- 1. IN <head>, FIRST THING. Without this the page can render blank. -->
<script>document.documentElement.classList.add('js')</script>

<!-- 2. CSS. Every hidden-until-revealed rule MUST be scoped to .js -->
<style>
.js .rv{opacity:0;transform:translateY(22px);
  transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
.js .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  html{scroll-behavior:auto}
  .js .rv{opacity:1;transform:none}
}
</style>

<!-- 3. Script, at the end of <body>. -->
<script>
(function(){
  "use strict";

  /* ---------- bilingual ----------
     The DEFAULT language lives in the HTML and is harvested at load, so it is
     never maintained in two places. The OTHER language lives in OTHER below.
     Pick the default from the prospect's own market, not a fixed rule. */
  var HTML_LANG = document.documentElement.lang || 'fr';
  var OTHER_LANG = (HTML_LANG === 'fr') ? 'en' : 'fr';

  var BASE = {};
  document.querySelectorAll('[data-i18n]').forEach(function(el){ BASE[el.dataset.i18n] = el.innerHTML; });

  var OTHER = {
    /* one key per data-i18n attribute, no more, no fewer */
  };

  var TITLES = {};
  TITLES[HTML_LANG]  = document.title;
  TITLES[OTHER_LANG] = document.title; /* replace with the translated title */

  var lang = HTML_LANG;

  function setLang(l){
    var dict = (l === HTML_LANG) ? BASE : OTHER;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var v = dict[el.dataset.i18n];
      if (typeof v === "string") el.innerHTML = v;
    });
    document.documentElement.lang = l;
    document.title = TITLES[l];
    document.querySelectorAll('.lang button').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.lang === l));
    });
    lang = l;
    try { localStorage.setItem('demo-lang', l); } catch(e){}
  }
  document.querySelectorAll('.lang button').forEach(function(b){
    b.addEventListener('click', function(){ setLang(b.dataset.lang); });
  });
  try {
    var saved = localStorage.getItem('demo-lang');
    if (saved && saved !== HTML_LANG) setLang(saved);
  } catch(e){}

  /* ---------- mobile nav ---------- */
  var burger = document.getElementById('burger'), nav = document.getElementById('nav');
  if (burger && nav){
    burger.addEventListener('click', function(){
      var open = nav.classList.toggle('open');
      burger.setAttribute('aria-expanded', String(open));
    });
    nav.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){
        nav.classList.remove('open'); burger.setAttribute('aria-expanded','false');
      });
    });
  }

  /* ---------- scroll reveals ---------- */
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var items = document.querySelectorAll('.rv');

  if (reduce || !('IntersectionObserver' in window)){
    items.forEach(function(el){ el.classList.add('in'); });
  } else {
    var ioFired = false;
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        ioFired = true;
        var sibs = Array.prototype.slice.call(e.target.parentNode.children)
          .filter(function(n){ return n.classList.contains('rv'); });
        var i = Math.max(0, sibs.indexOf(e.target));
        e.target.style.transitionDelay = Math.min(i * 70, 350) + 'ms';
        e.target.classList.add('in');
        io.unobserve(e.target);
      });
    }, { threshold:0.12, rootMargin:'0px 0px -8% 0px' });
    items.forEach(function(el){ io.observe(el); });

    /* THE FAIL-SAFE, in three parts. Do not remove any of them.
       Learned the hard way on TOP Construction Design, 2026-08-11: the old version
       only fired when ZERO elements had revealed. Three hero blocks revealed at load,
       which disabled it, and the other 21 stayed at opacity 0 forever. A reload
       halfway down the page showed a sheet of blank paper. */

    /* 1. Anything at or above the fold is revealed at once. The observer never reports
          elements that are already scrolled past, so without this a mid-page reload or
          an anchor landing leaves everything above the scroll position invisible. */
    function revealPassed(){
      items.forEach(function(el){
        if (el.classList.contains('in')) return;
        if (el.getBoundingClientRect().top < window.innerHeight){
          el.style.transitionDelay = '0ms';
          el.classList.add('in');
          io.unobserve(el);
        }
      });
    }
    revealPassed();
    window.addEventListener('load', revealPassed);
    /* 2. Scroll and resize are the non-observer path: they keep content visible even
          where IntersectionObserver never fires. Browsers restore the previous scroll
          position AFTER this script runs, so poll briefly to catch that too. */
    window.addEventListener('scroll', revealPassed, {passive:true});
    window.addEventListener('resize', revealPassed);
    var ticks = 0, poll = setInterval(function(){
      revealPassed();
      if (++ticks > 12) clearInterval(poll);
    }, 400);
    /* 3. Last resort, ONLY when the observer itself never fired once. Scoped this way
          so the reveal still plays normally further down a page that works. */
    window.addEventListener('beforeprint', function(){
      items.forEach(function(el){ el.style.transitionDelay = '0ms'; el.classList.add('in'); });
    });
    setTimeout(function(){
      if (ioFired) return;
      items.forEach(function(el){ el.style.transitionDelay = '0ms'; el.classList.add('in'); });
    }, 2500);
  }

  /* ---------- counters ----------
     The real value is already in the HTML (data-count="500" AND text 500).
     JS writes "0" only at the instant it can actually animate, so a page with
     broken JS still shows the true number instead of 0. */
  if (!reduce && 'IntersectionObserver' in window){
    var co = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        var el = e.target, end = parseInt(el.dataset.count, 10), t0 = null;
        el.textContent = '0';
        function step(ts){
          if (t0 === null) t0 = ts;
          var p = Math.min((ts - t0) / 1300, 1);
          el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3)));
          if (p < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
        co.unobserve(el);
      });
    }, { threshold:0.5 });
    document.querySelectorAll('[data-count]').forEach(function(el){ co.observe(el); });
  }

  /* ---------- demo form ---------- */
  var f = document.getElementById('f');
  if (f) f.addEventListener('submit', function(ev){
    ev.preventDefault();
    document.getElementById('sent').classList.add('on');
  });
})();
</script>

<!-- 4. Optional: open / closed badge driven by the prospect's real hours.
     Cheap, and it lands well for any business with posted hours. -->
<script>
(function(){
  function localNow(tz){
    try {
      var p = new Intl.DateTimeFormat('en-CA', {
        timeZone: tz, weekday:'short', hour:'numeric', minute:'numeric', hour12:false
      }).formatToParts(new Date());
      var o = {}; p.forEach(function(x){ o[x.type] = x.value; });
      var h = parseInt(o.hour,10); if (h === 24) h = 0;   /* Intl returns 24 at midnight */
      return { day:o.weekday, h:h, m:parseInt(o.minute,10) };
    } catch(e){ return null; }
  }
  window.paintOpenBadge = function(opts){
    /* opts: {tz, openHour, closeHour, days, dotId, textId, openText, closedText} */
    var t = localNow(opts.tz || 'America/Toronto');
    var dot = document.getElementById(opts.dotId), txt = document.getElementById(opts.textId);
    if (!t || !dot || !txt) return;
    var days = opts.days || ['Mon','Tue','Wed','Thu','Fri'];
    var open = days.indexOf(t.day) !== -1 && t.h >= opts.openHour && t.h < opts.closeHour;
    dot.classList.toggle('off', !open);
    txt.textContent = open ? opts.openText : opts.closedText;
  };
})();
</script>
